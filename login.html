<!doctype html>
<html lang="pt-BR" data-i18n-title="login.title">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171d26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coup Master">
  <title>Login | Coup Master</title>
  <script src="js/i18n/initial-language.js"></script>
  <link rel="icon" href="assets/img/logo/favicon-coup-master.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/logo/coup-master-512x512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lobby.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/compat.css">
</head>

<body class="login-page">
  <details class="language-floating">
    <summary class="language-floating-toggle" aria-label="Idioma" data-i18n-aria-label="language.label">
      <img src="assets/img/icons/translate.svg" alt="" aria-hidden="true">
    </summary>
    <div class="language-floating-panel">
      <div class="language-switcher">
        <label for="languageSelectLogin" data-i18n="language.label">Idioma</label>
        <select id="languageSelectLogin" data-language-select aria-label="Idioma" data-i18n-aria-label="language.label">
          <option value="pt-BR" data-i18n="language.portuguese">Portugues</option>
          <option value="en-US" data-i18n="language.english">English</option>
        </select>
      </div>
    </div>
  </details>

  <main class="lobby-box auth-box">
    <h1>Coup Master</h1>
    <p class="auth-subtitle" data-i18n="login.subtitle">Entre para criar ou acessar uma sala.</p>

    <div class="auth-actions">
        <button id="google-login-btn" class="auth-btn google-auth-btn" type="button">
          <img src="assets/img/icons/google.svg" alt="G" class="google-icon">
          <span data-i18n="login.google">Entrar com Google</span>
        </button>

        <button id="anonymous-login-btn" class="auth-btn anonymous-auth-btn" type="button">
          <span data-i18n="login.guest">Entrar como visitante</span>
        </button>

        <button id="installPwaBtn" class="auth-btn install-auth-btn" type="button" data-pwa-install hidden>
          <span data-i18n="pwa.install">Instalar Coup Master</span>
        </button>
    </div>

    <div id="loginStatus" class="status-text" role="status" aria-live="polite"></div>
    <p class="pwa-install-status" data-pwa-status role="status" aria-live="polite"></p>
  </main>

  <footer class="legal-footer" aria-label="Documentos legais" data-i18n-aria-label="common.legalDocuments">
    <a href="legal/privacy.html" class="legal-footer-link">
      <img src="assets/img/icons/parchment.svg" alt="" aria-hidden="true">
      <span data-i18n="common.privacy">Privacidade</span>
    </a>
    <a href="legal/terms.html" class="legal-footer-link">
      <img src="assets/img/icons/gavel.svg" alt="" aria-hidden="true">
      <span data-i18n="common.terms">Termos</span>
    </a>
  </footer>

  <div id="font-loader" class="loader-overlay" role="status" aria-live="polite">
    <div class="loader-content">
      <p id="loader-message" data-i18n="login.sessionLoading"><span data-loading-lang="pt-BR">Verificando sessão...</span><span
          data-loading-lang="en-US">Checking session...</span></p>
    </div>
  </div>

  <script src="js/i18n/language-service.js" defer></script>
  <script type="module" src="js/pwa.js"></script>
  <script type="module" src="js/firebase/login-page.js"></script>
</body>

</html>
