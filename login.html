<!doctype html>
<html lang="pt-BR" data-i18n-title="login.title">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171d26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coup Master 3D">
  <title>Entrar | Coup Master 3D</title>
  <script src="js/i18n/initial-language.js"></script>
  <link rel="icon" href="assets/img/logo/favicon-coup-master.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/logo/coup-master-512x512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/online.css">
</head>

<body>
  <main class="online-shell">
    <section class="online-panel" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Coup Master</h1>
      <!-- <p>Entre com sua conta Google para criar uma mesa online ou participar de uma sala.</p> -->
      <div class="login-title-spacer" aria-hidden="true"></div>

      <div class="online-actions">
        <button id="googleLoginBtn" class="primary-btn" type="button" data-i18n="login.google">Entrar com Google</button>
        <button id="guestLoginBtn" class="secondary-btn" type="button" data-i18n="login.guest">Entrar como visitante</button>
        <button class="secondary-btn pwa-install-btn" type="button" data-pwa-install data-i18n="pwa.install" hidden>
          Instalar Coup Master 3D
        </button>
      </div>

      <div class="room-form">
        <label for="loginLanguageSelect" data-i18n="language.label">Idioma</label>
        <select id="loginLanguageSelect" data-language-select aria-label="Idioma" data-i18n-aria-label="language.label">
          <option value="pt-BR" data-i18n="language.portuguese">Português</option>
          <option value="en-US" data-i18n="language.english">English</option>
        </select>
      </div>

      <div id="loginStatus" class="status-text" role="status" aria-live="polite"></div>
      <p class="pwa-install-status" data-pwa-status role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/i18n/language-service.js" defer></script>
  <script type="module" src="js/pwa.js"></script>
  <script type="module" src="js/firebase/login-page.js"></script>
</body>

</html>
